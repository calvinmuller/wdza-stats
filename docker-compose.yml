services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wdza
      POSTGRES_PASSWORD: wdza
      POSTGRES_DB: wdza_stats
    ports:
      - "54329:5432"
    volumes:
      - wdza-postgres-data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro

volumes:
  wdza-postgres-data:
